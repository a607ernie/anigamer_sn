name: Build and Release Windows Executable

on:
  workflow_dispatch:  # 允許手動觸發
  push:
    tags:
      - 'v*'  # 當推送 v 開頭的 tag 時觸發 (例如 v1.0.0)

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # 需要寫入權限來建立 Release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pyinstaller

    - name: Build with PyInstaller
      run: |
        # 使用 --onefile 打包成單一執行檔
        # 使用 --name 指定輸出檔名
        pyinstaller --onefile --name anime_scraper run.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: anime_scraper_windows
        path: dist/anime_scraper.exe

    - name: Create Release and Upload Asset
      if: startsWith(github.ref, 'refs/tags/')  # 只在有 tag 時執行
      uses: softprops/action-gh-release@v2
      with:
        files: dist/anime_scraper.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
